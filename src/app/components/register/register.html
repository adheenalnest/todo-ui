<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <h1>TodoApp</h1>
    </div>
    <h2>Create account</h2>
    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Enter name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter password" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Confirm password" />
      </div>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <button type="submit">Register</button>
    </form>
    <p class="link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
