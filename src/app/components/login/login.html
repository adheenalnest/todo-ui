<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <h1>TodoApp</h1>
    </div>
    <h2>Welcome back</h2>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter password" />
      </div>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <button type="submit">Login</button>
    </form>
    <p class="link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
